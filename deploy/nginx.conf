server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    autoindex off;

    # Framework forms only; scene-version file content has its own streaming location below.
    client_max_body_size 20m;
    add_header X-Content-Type-Options nosniff always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Stream raw file uploads and administrator downloads to the authenticated application.
    location ~ ^/prod-api/api/v1/scene-versions/[^/]+/files/[^/]+/content$ {
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_http_version 1.1;
        rewrite ^/prod-api/(.*)$ /$1 break;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_body_timeout 60s;
    }

    location /prod-api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        # No X-Accel-Redirect delivery route until publication authorization exists.
        proxy_ignore_headers X-Accel-Redirect;
    }

    # Reserved namespaces fail closed. No artifact volume is mounted in this gateway yet.
    location ^~ /artifacts { return 404; }
    location ^~ /_artifacts { return 404; }
    location ^~ /staging { return 404; }
    location ^~ /committed { return 404; }
    location ^~ /data/ { return 404; }
    location ~ /\. { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
