components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: ^AR_[0-9]{3}$
        message:
          type: string
        traceId:
          type: string
      required:
      - code
      - message
      - traceId
    FrameworkResponse:
      type: object
      additionalProperties: true
      properties:
        code:
          type: integer
        msg:
          type: string
    Login:
      type: object
      additionalProperties: false
      properties:
        username:
          type: string
        password:
          type: string
          minLength: 6
          maxLength: 64
      required:
      - username
      - password
    AccountCreate:
      type: object
      additionalProperties: false
      properties:
        userName:
          type: string
          pattern: ^[A-Za-z0-9_]{3,30}$
        nickName:
          type: string
          minLength: 1
          maxLength: 30
        password:
          type: string
          minLength: 6
          maxLength: 64
      required:
      - userName
      - nickName
      - password
    AccountStatus:
      type: object
      additionalProperties: false
      properties:
        userId:
          type: integer
          format: int64
        status:
          type: string
          enum:
          - '0'
          - '1'
      required:
      - userId
      - status
    AccountPassword:
      type: object
      additionalProperties: false
      properties:
        userId:
          type: integer
          format: int64
        password:
          type: string
          minLength: 6
          maxLength: 64
      required:
      - userId
      - password
    OwnPassword:
      type: object
      additionalProperties: false
      properties:
        oldPassword:
          type: string
        newPassword:
          type: string
          minLength: 6
          maxLength: 64
      required:
      - oldPassword
      - newPassword
    ProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        nickName:
          type: string
          maxLength: 30
        email:
          type: string
          maxLength: 50
        phonenumber:
          type: string
          maxLength: 11
        sex:
          type: string
          enum:
          - '0'
          - '1'
          - '2'
    EnabledUpdate:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        expectedVersion:
          type: integer
          minimum: 0
        reason:
          type: string
          minLength: 1
      required:
      - enabled
      - expectedVersion
      - reason
    AuditList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        total:
          type: integer
          minimum: 0
      required:
      - items
      - total
    SceneConfig:
      type: object
      additionalProperties: false
      properties:
        maxBytes:
          type: integer
          format: int64
          minimum: 1
        sceneMaxFiles:
          type: integer
          minimum: 1
        sceneMaxBytes:
          type: integer
          format: int64
          minimum: 1
      required:
      - maxBytes
      - sceneMaxFiles
      - sceneMaxBytes
    SceneFileInput:
      type: object
      additionalProperties: false
      properties:
        relativePath:
          type: string
          minLength: 1
          maxLength: 1024
        bytes:
          type: integer
          format: int64
          minimum: 1
        sha256: &id008
          type: string
          pattern: ^[0-9a-f]{64}$
      required:
      - relativePath
      - bytes
      - sha256
    SceneCreate:
      type: object
      additionalProperties: false
      properties:
        requestKey: *id001
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        files:
          type: array
          items:
            $ref: '#/components/schemas/SceneFileInput'
          minItems: 1
      required:
      - requestKey
      - name
      - files
    SceneUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        expectedVersion:
          type: integer
          minimum: 0
      required:
      - name
      - description
      - expectedVersion
    SceneFile:
      type: object
      additionalProperties: false
      properties:
        fileId: *id001
        relativePath:
          type: string
          minLength: 1
          maxLength: 1024
        bytes:
          type: integer
          format: int64
          minimum: 1
        sha256: *id008
        status:
          type: string
          enum:
          - PENDING
          - UPLOADING
          - AVAILABLE
          - FAILED
        failureReason:
          type: string
          nullable: true
        attempts:
          type: integer
          minimum: 0
      required:
      - fileId
      - relativePath
      - bytes
      - sha256
      - status
      - failureReason
      - attempts
    SceneSummary:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        name: &id010
          type: string
          minLength: 1
          maxLength: 200
        description: &id011
          type: string
          maxLength: 2000
        enabled: &id012
          type: boolean
        lockVersion: &id013
          type: integer
          minimum: 0
        uploadStatus: &id014
          type: string
          enum:
          - PENDING
          - UPLOADING
          - FAILED
          - READY
          - DELETING
          - DELETE_FAILED
        fileCount: &id015
          type: integer
          minimum: 0
        availableCount: &id016
          type: integer
          minimum: 0
        failedCount: &id017
          type: integer
          minimum: 0
        totalBytes: &id018
          type: integer
          format: int64
          minimum: 0
        createdAt: &id009
          type: string
          format: date-time
        updatedAt: *id009
      required:
      - id
      - name
      - description
      - enabled
      - lockVersion
      - uploadStatus
      - fileCount
      - availableCount
      - failedCount
      - totalBytes
      - createdAt
      - updatedAt
    SceneDetail:
      type: object
