            schema:
              $ref: '#/components/schemas/EnabledUpdate'
  /api/v1/audits:
    get:
      operationId: listAudits
      summary: 只读场景业务审计
      description: 仅 ar_admin 管理员；AR_STORAGE_ENABLED=true 时开放。包含 SCENE_CREATE、SCENE_UPDATE、SCENE_SET_ENABLED、SCENE_DELETE_REQUEST、SCENE_DELETE、SCENE_DELETE_FAILED
        与文件上传结果动作；历史 VERSION_* 标签作为不可变历史记录保留。
      security:
      - bearerAuth: []
      parameters:
      - *id002
      - *id003
      responses:
        '200':
          description: Success
          content:
