  /api/v1/scenes/{sceneId}/files/{fileId}/content:
    put:
      operationId: uploadSceneFile
      summary: 流式上传并校验文件
      description: 仅 ar_admin 管理员；AR_STORAGE_ENABLED=true 时开放。原始字节流。接收时一次校验实际大小与 SHA256，通过后无覆盖提交并直接
        AVAILABLE；已 AVAILABLE 的文件不覆盖。每次新尝试 attempts 加一。大小或摘要不符 422，存储 IO 失败 503，均持久化
        FAILED 与原因；同文件处理中 409。请求超时只代表结果未确认，先 GET 单文件核对。无分片协议。
      security:
      - bearerAuth: []
      parameters:
      - name: sceneId
        in: path
        required: true
        schema: *id001
      - name: fileId
        in: path
        required: true
        schema: *id001
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SceneFile'
        '400':
          description: Request failed; 409 covers state conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Request failed; 409 covers state conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Request failed; 409 covers state conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Request failed; 409 covers state conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Request failed; 409 covers state conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request failed; 409 covers state conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Request failed; 409 covers state conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Request failed; 409 covers state conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 实际大小或 SHA256 与登记不符；失败原因已持久化
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-implementation: implemented
      tags:
      - 场景
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
    get:
      operationId: downloadSceneFile
      summary: 管理员读取单个文件
      description: 仅 ar_admin 管理员；AR_STORAGE_ENABLED=true 时开放。文件必须 AVAILABLE 且场景无删除意图；允许尚未全部上传的场景读取已完成文件，场景停用不影响管理员读取。强
        ETag 为登记的 SHA256，支持 Range、If-Range；不重算其他文件。管理员下载带 attachment 文件名。
      security:
      - bearerAuth: []
      parameters:
      - name: sceneId
        in: path
        required: true
        schema: *id001
      - name: fileId
        in: path
        required: true
        schema: *id001
      - name: Range
        in: header
        required: false
        schema:
          type: string
        description: 单个 bytes Range；无效或多段 Range 忽略并返回完整文件
      - name: If-Range
        in: header
        required: false
        schema:
          type: string
        description: 强 ETag，不匹配返回完整文件
      responses:
        '200':
          description: 完整文件
          content: &id004
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Request failed; 409 covers state conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Request failed; 409 covers state conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Request failed; 409 covers state conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Request failed; 409 covers state conflicts
          content:
            application/json:
              schema:
