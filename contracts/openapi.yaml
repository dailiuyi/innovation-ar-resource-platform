components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: ^AR_[0-9]{3}$
        message:
          type: string
        traceId:
          type: string
      required:
      - code
      - message
      - traceId
    FrameworkResponse:
      type: object
      additionalProperties: true
      properties:
        code:
          type: integer
        msg:
          type: string
    Login:
      type: object
      additionalProperties: false
      properties:
        username:
          type: string
        password:
          type: string
          minLength: 6
          maxLength: 64
      required:
      - username
      - password
    AccountCreate:
      type: object
      additionalProperties: false
      properties:
        userName:
          type: string
          pattern: ^[A-Za-z0-9_]{3,30}$
        nickName:
          type: string
          minLength: 1
          maxLength: 30
        password:
          type: string
          minLength: 6
          maxLength: 64
      required:
      - userName
      - nickName
      - password
    AccountStatus:
      type: object
      additionalProperties: false
      properties:
        userId:
          type: integer
          format: int64
        status:
          type: string
          enum:
          - '0'
          - '1'
      required:
      - userId
      - status
    AccountPassword:
      type: object
      additionalProperties: false
      properties:
        userId:
          type: integer
          format: int64
        password:
          type: string
          minLength: 6
          maxLength: 64
      required:
      - userId
      - password
    OwnPassword:
      type: object
      additionalProperties: false
      properties:
        oldPassword:
          type: string
        newPassword:
          type: string
          minLength: 6
          maxLength: 64
      required:
      - oldPassword
      - newPassword
    ProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        nickName:
          type: string
          maxLength: 30
        email:
          type: string
          maxLength: 50
        phonenumber:
          type: string
          maxLength: 11
        sex:
          type: string
          enum:
          - '0'
          - '1'
          - '2'
    SceneCreate:
      type: object
      additionalProperties: false
      properties:
        name: &id006
          type: string
          minLength: 1
          maxLength: 200
      required:
      - name
    EnabledUpdate:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        expectedVersion:
          type: integer
          minimum: 0
        reason:
          type: string
          minLength: 1
      required:
      - enabled
      - expectedVersion
      - reason
    AuditList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        total:
          type: integer
          minimum: 0
      required:
      - items
      - total
    SceneUpdate:
      type: object
      additionalProperties: false
      properties:
        name: *id006
        expectedVersion:
          type: integer
          minimum: 0
      required:
      - name
      - expectedVersion
    SceneView:
      type: object
      additionalProperties: false
      properties:
        name: *id006
        id: *id001
        enabled:
          type: boolean
        lockVersion:
          type: integer
          minimum: 0
        createdAt: &id007
          type: string
          format: date-time
        updatedAt: *id007
      required:
      - id
      - name
      - enabled
      - lockVersion
      - createdAt
      - updatedAt
    SceneList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SceneView'
        total:
          type: integer
          minimum: 0
      required:
      - items
      - total
    ResourceDescriptor:
      title: resource.json v1
      type: object
      additionalProperties: false
      properties:
        formatVersion:
          type: integer
          enum:
          - 1
        defaultVariant:
          type: string
          pattern: ^[a-z][a-z0-9_-]{0,63}$
        transform:
          type: object
          additionalProperties: false
          properties:
            position:
              type: array
              items:
                type: number
              minItems: 3
              maxItems: 3
            rotation:
