      x-implementation: implemented
      tags:
      - 场景
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SceneUpdate'
    delete:
      operationId: deleteScene
      summary: 整场景物理删除
      description: 仅 ar_admin 管理员；AR_STORAGE_ENABLED=true 时开放。先持久化删除意图再清理存储文件；上传进行中
        409，不改写活动字节流。存储删除失败 503 并保留意图，可重试；成功后重复 DELETE 返回 204，意图完成后忽略过期 expectedVersion。不存在且无回执
        404。删除的文件行不保留，场景行与最小删除回执保留。
      security:
      - bearerAuth: []
      parameters:
      - name: sceneId
        in: path
        required: true
        schema: *id001
      - name: expectedVersion
        in: query
        required: true
        schema:
          type: integer
          minimum: 0
      responses:
        '204':
          description: Success
        '400':
          description: Request failed; 409 covers state conflicts
          content:
