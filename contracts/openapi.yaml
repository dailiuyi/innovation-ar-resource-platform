  title: AR Demo and candidate API
  version: 0.3.0
  description: 'Demo: RuoYi + PostgreSQL, fixed-role administrators and scenes. Private
    draft ingestion supports multi-file registration, folder replacement, size/SHA256
    verification, retry, restart reconciliation, one published draft pointer per scene,
    and administrator ZIP/manifest downloads. Preview, anonymous download and client
    loading are not implemented. Historical cloud/day-night resource and publication
    contracts below await a real deliverable and client loading agreement; they are
    not implemented.'
