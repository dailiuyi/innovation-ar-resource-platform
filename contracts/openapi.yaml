openapi: 3.0.3
info:
  title: 4DGS Scene Resource API
  version: 0.6.0
  description: 4DGS 场景资源分发：管理员按名称、说明和固定文件清单创建场景，逐文件上传校验，启用后匿名客户端直接读取目录、固定文件清单与带 Range
    的文件流；支持名称/说明编辑、启停和整场景物理删除，没有版本或发布指针。保留若依登录与账号接口。匿名读取位于 /api/v1/client/，经同源网关直接访问，无需
    /prod-api。
servers:
- url: /
  description: 同源网关；管理接口经 /prod-api 前缀代理到后端
paths:
  /api/v1/scenes/config:
    get:
      operationId: sceneConfig
      summary: 查看单文件与单场景上传上限
      description: 仅 ar_admin 管理员；AR_STORAGE_ENABLED=true 时开放。返回 AR_STORAGE_MAX_BYTES、AR_STORAGE_SCENE_MAX_FILES、AR_STORAGE_SCENE_MAX_BYTES
        的运行值。
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SceneConfig'
        '400':
          description: Request failed; 409 covers state conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Request failed; 409 covers state conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Request failed; 409 covers state conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Request failed; 409 covers state conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Request failed; 409 covers state conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request failed; 409 covers state conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Request failed; 409 covers state conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Request failed; 409 covers state conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-implementation: implemented
      tags:
      - 场景
  /api/v1/scenes:
    post:
      operationId: createScene
      summary: 创建场景与固定文件清单
      description: 仅 ar_admin 管理员；AR_STORAGE_ENABLED=true 时开放。一个场景只有一份创建后固定的文件清单；上传完成并校验后，启用状态下自动对匿名客户端可见，没有发布操作。一次事务登记名称、说明和全部文件（相对路径、大小、SHA256）；默认启用。同
        requestKey 且名称、说明、文件清单完全相同时重试返回 200 与原场景；不同返回 409；同 requestKey 对应已删除或删除中的场景返回
        410，不复活。大小或数量超配置返回 413，路径不合法返回 400。
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SceneDetail'
        '400':
          description: Request failed; 409 covers state conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Request failed; 409 covers state conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Request failed; 409 covers state conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Request failed; 409 covers state conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Request failed; 409 covers state conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request failed; 409 covers state conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Request failed; 409 covers state conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Request failed; 409 covers state conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: 完全相同的重试，返回原场景详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SceneDetail'
        '410':
          description: 同请求键的场景已删除或正在删除，不复活
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-implementation: implemented
      tags:
      - 场景
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SceneCreate'
    get:
      operationId: listScenes
      summary: 列出场景概要
      description: 仅 ar_admin 管理员；AR_STORAGE_ENABLED=true 时开放。按创建时间倒序；不含已完全删除的场景，删除中/删除失败的场景仍可见以支持重试。
      security:
      - bearerAuth: []
      parameters:
      - &id002
        name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - &id003
        name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: name
        in: query
        required: false
        schema:
          type: string
          maxLength: 200
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SceneList'
        '400':
          description: Request failed; 409 covers state conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Request failed; 409 covers state conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Request failed; 409 covers state conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Request failed; 409 covers state conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Request failed; 409 covers state conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request failed; 409 covers state conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Request failed; 409 covers state conflicts
          content:
