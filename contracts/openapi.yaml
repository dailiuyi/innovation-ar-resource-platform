  /api/v1/scenes/{sceneId}/enabled:
    put:
      operationId: setSceneEnabled
      summary: 启用或停用场景
      description: 仅 ar_admin 管理员；AR_STORAGE_ENABLED=true 时开放。reason 必填并写入审计。启停只影响新的匿名读取；已有文件流可完成。上传与恢复从不自动启用场景。expectedVersion
        为场景 lockVersion，冲突 409。
      security:
      - bearerAuth: []
      parameters:
      - name: sceneId
        in: path
        required: true
        schema: *id001
      responses:
        '200':
          description: Success
          content:
