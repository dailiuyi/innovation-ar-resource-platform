    post:
      operationId: createSceneVersion
      summary: 导入资源目录，创建成品版本
      description: 仅 ar_admin 管理员；AR_STORAGE_ENABLED=true 时开放。一次登记 resource.json 与全部文件清单；描述引用路径集合必须与
        files 完全相等，创建后描述与清单不可变。同 requestKey 且 description、descriptor、文件清单完全相同返回 200
        与原版本，不同返回 409，已整版删除的版本迟到重试返回 410。大小或数量超配置返回 413，描述错误返回 400 并指出字段或路径。
